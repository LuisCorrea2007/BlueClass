services:
  - type: web
    name: memora-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MEMORA_ENV
        value: production
      - key: MEMORA_API_TOKEN
        sync: false
      - key: MEMORA_DATABASE_URL
        sync: false
